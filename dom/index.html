<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="./assets/styles.css" />
        <title>DOM Manipulation</title>
    </head>
    <body>
        <!-- Header section -->
        <header id="main-header" class="bg-white p-4 mb-3">
            <div class="container">
                <a href="https://devfinity.io/">
                    <img
                        src="./assets/images/brand-logo.svg"
                        alt="brand_logo"
                    />
                </a>
                <h1 id="header-title" class="text-center">
                    Menu <span style="display: none">World</span>
                </h1>
            </div>
        </header>
        <!-- /Header section -->

        <!-- Main section -->
        <div class="container">
            <div id="main" class="card card-body">
                <h2 class="title">Add menu</h2>
                <form class="form-inline" id="menu-form">
                    <input type="text" class="form-control mr-2" />
                    <input type="submit"  class="btn btn-dark" value="Submit" />                    
                </form>
                <p id="error-message" style="color:red;font-size:12px; visibility: hidden;">error</p>
                
                <h2 class="title">Menu list</h2>
                <ul class="list-group" id="menu">
                </ul>
                <div id="output"></div>
                <button class="btn btn-dark btn-block" id="button">
                    Click Here
                </button>
            </div>
            <br />
        </div>
        <!-- /Main section -->
        
        <footer>
            <span>© 2023 Devfinity, LLC. All Rights Reserved</span>
        </footer>
        <script src="./js/main.js"></script>
        <script src="./js/crud.js" type="module"></script>

    </body>
</html>
